name: 현황판 데이터 갱신·배포

on:
  push:
    branches: [main]
  schedule:
    - cron: '10 15 * * *'   # KST 00:10
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-dash
  cancel-in-progress: false

jobs:
  update:
    # 스케줄·수동 실행에서만 GA4를 조회한다. push는 배포만.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fetch-ga4.mjs
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SA_JSON: ${{ secrets.GA4_SA_JSON }}
      - name: 변경 시에만 커밋(최대 3회 재시도)
        run: |
          if git diff --quiet dash/data.json; then echo "변경 없음"; exit 0; fi
          git config user.name "dash-bot"
          git config user.email "dash-bot@users.noreply.github.com"
          cp dash/data.json /tmp/data.json
          for i in 1 2 3; do
            git checkout -- dash/data.json
            git pull --rebase origin main
            cp /tmp/data.json dash/data.json
            git add dash/data.json
            git commit -m "chore: 현황판 데이터 갱신" || exit 0
            if git push origin main; then exit 0; fi
            git reset --soft HEAD~1
            sleep 5
          done
          echo "push 3회 실패"; exit 1

  deploy:
    needs: [update]
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
