name: 현황판 데이터 갱신

on:
  schedule:
    - cron: '10 15 * * *'   # KST 00:10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fetch-ga4.mjs
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SA_JSON: ${{ secrets.GA4_SA_JSON }}
      - name: 변경 시에만 커밋
        run: |
          if git diff --quiet dash/data.json; then echo "변경 없음"; exit 0; fi
          git config user.name "dash-bot"
          git config user.email "dash-bot@users.noreply.github.com"
          git add dash/data.json
          git commit -m "chore: 현황판 데이터 갱신"
          git push
